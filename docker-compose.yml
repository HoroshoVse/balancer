services:
  backend:
    image: ghcr.io/horoshovse/balancer-backend:latest
    network_mode: "host"
    volumes:
      - ./backend/certs:/app/certs
      - ./backend/data:/app/data
    environment:
      # Connect to the database via localhost because network_mode: host bypasses Docker DNS
      - DB_DSN=postgres://balancer:balancer@127.0.0.1:54432/balancer?sslmode=disable
      # The API stays on loopback; the frontend's nginx proxies /api to it
      - API_ADDR=127.0.0.1:8080
      # Optional: JWT signing secret (at least 32 chars). If unset, a random one is generated and stored in the DB.
      # - JWT_SECRET=
      # Optional: initial admin password, used only on first start. If unset, a random one is printed to the logs.
      # - ADMIN_PASSWORD=
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: balancer
      POSTGRES_PASSWORD: balancer
      POSTGRES_DB: balancer
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:54432:5432" # Bind only to localhost for security
    restart: unless-stopped

  frontend:
    image: ghcr.io/horoshovse/balancer-frontend:latest
    # Host network so nginx can reach the loopback-only API
    network_mode: "host"
    environment:
      - NGINX_PORT=3000
      - API_UPSTREAM=127.0.0.1:8080
    restart: unless-stopped

volumes:
  postgres_data:
