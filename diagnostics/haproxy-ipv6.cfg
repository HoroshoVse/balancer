# Run on the SAME Linux host as Balancer. Replace the documentation IPv6
# address below with the node's real IPv6 address. Port 12443 must be unused.
# Keep the client's UUID, SNI, REALITY public key/short ID and XHTTP settings;
# change only the client connection port to 12443 for this comparison.
global
    log stdout format raw local0

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 5s
    timeout client 1h
    timeout server 1h

frontend xray_ipv4_test
    bind 0.0.0.0:12443
    default_backend xray_ipv6

backend xray_ipv6
    server node [2001:db8::10]:12006 send-proxy-v2
